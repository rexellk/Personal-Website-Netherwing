<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Netherwing intro prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px system-ui, sans-serif; color: #e6def5; }
  canvas { display: block; }
  .bar { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 5; pointer-events: none; }
  #barTop { top: 0; } #barBot { bottom: 0; }
  #flash { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, #ffffff 0%, #f0c9e4 22%, #8f78c4 55%, #0c0716 100%); }
  #hud { position: fixed; left: 12px; right: 12px; bottom: 10px; z-index: 10; display: flex; gap: 10px; align-items: center;
    background: rgba(10,6,20,0.75); padding: 8px 12px; border-radius: 4px; }
  #hud input[type=range] { flex: 1; }
  #hud button { background: #2a1d40; color: #e6def5; border: 1px solid #5a4680; padding: 4px 10px; cursor: pointer; }
  #shot { min-width: 250px; }
  #hud.hidden { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
} }
</script>
</head>
<body>
<div id="barTop" class="bar"></div>
<div id="barBot" class="bar"></div>
<div id="flash"></div>
<div id="hud">
  <button id="play">Play</button>
  <button id="idle">Idle</button>
  <input id="scrub" type="range" min="0" max="8" step="0.01" value="0" />
  <span id="time">0.00s</span>
  <span id="shot">It waits</span>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
